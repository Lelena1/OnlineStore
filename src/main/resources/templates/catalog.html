<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Каталог')"></head>
<body>
<div th:replace="fragments :: nav"></div>
<main>
    <h1>Каталог товаров</h1>

    <div class="product-grid">
        <div class="product-card" th:each="product : ${productPage.content}">
            <img th:src="${product.imageUrl}" th:alt="${product.name}">
            <div class="category" th:text="${product.category}">Категория</div>
            <strong th:text="${product.name}">Название товара</strong>
            <div class="price" th:text="${product.price} + ' ₽'">0 ₽</div>
            <div th:text="'В наличии: ' + ${product.stock}">В наличии: 0</div>
            <form th:action="@{/cart/add}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}">
                <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}">
                <button type="submit" th:disabled="${product.stock == 0}">В корзину</button>
            </form>
        </div>
    </div>

    <div class="pagination" th:if="${productPage.totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
           th:href="@{/catalog(page=${i})}"
           th:text="${i + 1}"
           th:classappend="${i == productPage.number} ? 'active'">1</a>
    </div>
</main>
</body>
</html>
