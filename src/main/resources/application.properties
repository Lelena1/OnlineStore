spring.application.name=local-shop
server.port=8080

# --- Datasource: SQLite file under ./data, relative to the working directory ---
# journal_mode=WAL: allows concurrent readers while one writer holds the lock
# busy_timeout=30000: wait up to 30s for a lock instead of failing immediately
# foreign_keys=on: SQLite ignores FK constraints unless explicitly enabled per connection
spring.datasource.url=jdbc:sqlite:./data/shop.db?journal_mode=WAL&busy_timeout=30000&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite supports only a single writer at a time -> keep the pool at size 1
# so the app never contends with itself for the write lock.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# With a single-connection pool, Open-Session-in-View would serialize page
# rendering behind whatever request holds the one connection; disable it and
# fetch what templates need explicitly via JOIN FETCH in repository queries.
spring.jpa.open-in-view=false
